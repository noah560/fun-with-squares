[package]
name = "fun_wgpu"
version = "0.1.0"
edition = "2024"
description = "A simple wrapper for the combination of wgpu and winit solely for window operations. Still use wgpu for drawing. Adapted from `https://sotrh.github.io/learn-wgpu`."

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "30.0"
pollster = "0.3"
